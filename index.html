<style>
:root{--bg:#f3f5ef;--surface:#fff;--ink:#1f2a22;--muted:#5d6b60;--line:#d6ddd2;--accent:#2f6b4f;--soft:#e2eee6;
--display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141a16;--surface:#1d251f;--ink:#e6ece5;--muted:#9fb0a3;--line:#2f3b33;--accent:#7cc39c;--soft:#233a2d;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:22px}

.grade{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}

a.q{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
a.q:hover,a.q:focus-visible{border-color:var(--accent);outline:none}
.subj{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:2px 10px;border-radius:20px;white-space:nowrap}
.empty{color:var(--muted);font-size:15px;margin:0}
</style></head><body>
